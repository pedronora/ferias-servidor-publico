services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ferias}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ferias_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ferias}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ferias_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runtime
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ferias}:${POSTGRES_PASSWORD:-ferias_dev_password}@db:5432/${POSTGRES_DB:-ferias}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:-dev-only-session-secret-change-me-1234567890}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ferias_db_data:
