name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint e formatação
        run: pnpm lint

  typecheck:
    name: Tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: Testes unitários e de componentes (${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, America/Sao_Paulo]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Testes com cobertura
        run: pnpm test:coverage
        env:
          TZ: ${{ matrix.tz }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.tz }}
          path: coverage
          if-no-files-found: ignore

  integration-tests:
    name: Testes de integração
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ferias
          POSTGRES_PASSWORD: ferias_dev_password
          POSTGRES_DB: ferias_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferias -d ferias_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ferias:ferias_dev_password@localhost:5432/ferias_test
      NUXT_SESSION_SECRET: ci-session-secret-com-pelo-menos-32-caracteres
      NUXT_PUBLIC_APP_URL: http://localhost:3101
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin12345
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Aplicar migrations
        run: pnpm db:migrate
      - name: Testes de integração
        run: pnpm test:integration

  build-image:
    name: Build da imagem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: ferias:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Instalar navegador
        run: pnpm exec playwright install --with-deps chromium
      - name: Subir a stack
        run: docker compose up -d --build
        env:
          SEED_DEMO_DATA: 'true'
          NUXT_SESSION_SECRET: ci-session-secret-com-pelo-menos-32-caracteres
      - name: Aguardar healthcheck
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs app
          exit 1
      - name: Playwright
        run: pnpm exec playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Logs da aplicação em falha
        if: failure()
        run: docker compose logs app db
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validar título do PR
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Validar commits do PR
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-success:
    name: ci-success
    if: always()
    needs:
      - lint
      - typecheck
      - unit-tests
      - integration-tests
      - build-image
      - e2e
      - commitlint
      - dependency-review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar todos os jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -e '
            to_entries
            | all(.[];
                (.value.result == "success")
                or (
                  (.key == "commitlint" or .key == "dependency-review")
                  and .value.result == "skipped"
                )
              )
          '
