services:
  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ferias
      POSTGRES_PASSWORD: ferias_dev_password
      POSTGRES_DB: ferias_test
    ports:
      - '5433:5432'
    volumes:
      - ferias_test_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ferias -d ferias_test']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ferias_test_db_data:
