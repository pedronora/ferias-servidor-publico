name: ferias

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    env_file:
      - /mnt/hdd-pool/ferias/.env
    volumes:
      - ferias_db_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/pedronora/ferias-servidor-publico:latest
    pull_policy: always
    init: true
    restart: unless-stopped
    env_file:
      - /mnt/hdd-pool/ferias/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      - '3030:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  ferias_db_data:
